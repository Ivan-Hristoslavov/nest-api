<!--
  Stoclify.

  A stack of goods narrowing to the top crate, which is the one the product
  picks out: the same article at four suppliers, and the one worth buying
  carried highest. Geometric rather than illustrative so it survives being
  drawn at sixteen pixels in a browser tab, where a shelf with perspective on
  it turns to mud.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0d9488" />
  <g fill="#fff">
    <rect x="6" y="20.5" width="20" height="5" rx="1.8" opacity="0.45" />
    <rect x="8.5" y="13.75" width="15" height="5" rx="1.8" opacity="0.7" />
    <rect x="11" y="7" width="10" height="5" rx="1.8" />
  </g>
</svg>
